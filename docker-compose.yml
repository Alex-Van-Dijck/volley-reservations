services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: volley
      POSTGRES_PASSWORD: volley
      POSTGRES_DB: volley
    ports:
      - "5432:5432"
  db-test:
    image: postgres:16
    environment:
      POSTGRES_USER: volley
      POSTGRES_PASSWORD: volley
      POSTGRES_DB: volley_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
